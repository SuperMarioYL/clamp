<title id="process-title">Clamp 的四步流程</title>
<desc id="process-desc">init installs the gate, fix snapshots the bad worktree, compile derives the checks and replays three times, enforce stops the line at PreToolUse and pre-commit; unaffected files are shown untouched.</desc>
