<title id="architecture-title">Clamp 的运行结构</title>
<desc id="architecture-desc">The constraint file in the centre: the worktree, the bad snapshot and the last 40 commits feed compile and replay; the same constraint supplies PreToolUse&#39;s content_check and pre-commit&#39;s tree_check.</desc>
