<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" role="img" aria-labelledby="demo-commit-mobile-title demo-commit-mobile-desc" data-palette="92e656-6ae778-e6f6ac-4368a840bf2c">
<title id="demo-commit-mobile-title">Clamp 两次拦截（窄屏）</title>
<desc id="demo-commit-mobile-desc">pre-commit blocks the commit with exit 2 and no commit is created; PreToolUse blocks the same text before the write.</desc>
