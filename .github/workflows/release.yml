name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag against VERSION
        run: |
          version="v$(cat VERSION)"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION (${version})" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Pack the npm package
        id: pack
        run: |
          npm pack --pack-destination dist --silent
          tarball="$(ls dist/clamp-*.tgz)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "packed ${tarball}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "Clamp ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Upload the tarball and the demo cast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.pack.outputs.tarball }}" \
            assets/demo.cast \
            --clobber
